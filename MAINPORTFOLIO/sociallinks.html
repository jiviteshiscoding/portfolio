<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Social Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: hsl(40, 50%, 86%);
      color: #111;
    }
    .social-links {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .social-links li {
      margin: 0;
    }
    .social-links a {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-decoration: none;
      color: #111;
      background: #fff;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .social-links a:hover {
      background: #e6f2ff;
      border-color: #0084ff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <h1>Connect with me</h1>
  <p>Follow or contact me on these profiles:</p>
  <ul class="social-links">
    <li><a href="https://www.linkedin.com/in/jivitesh-falak-b81536388?utm_source=share_via&utm_content=profile&utm_medium=member_android">LinkedIn</a></li>
    <li><a href="https://www.instagram.com/jivi_gv?igsh=bDUxeXMxeDJtaThl">Instagram</a></li>
    <li><a href="https://github.com/jiviiscoding-profile" >GitHub</a></li>
  </ul>
</body>
</html>
